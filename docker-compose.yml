services:
  stt-service:
    build: ./stt-service
    ports:
      - "8000:8000"
    volumes:
      - whisper-model-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  backend:
    build: ./beckend
    ports:
      - "3003:3003"
    environment:
      STT_SERVICE_URL: http://stt-service:8000/transcribe
    depends_on:
      stt-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5175:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  whisper-model-cache:
